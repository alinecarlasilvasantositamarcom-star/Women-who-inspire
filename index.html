<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mulheres que Inspiram</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1B5E20, #2E7D32);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .fundo-animado { position: absolute; width: 100%; height: 100%; overflow: hidden; }
        .particula {
            position: absolute; border-radius: 50%; background: rgba(255,255,255,0.1);
            animation: flutuar 8s infinite ease-in-out;
        }
        .p1 { width: 80px; height: 80px; top: 10%; left: 10%; animation-delay: 0s; }
        .p2 { width: 60px; height: 60px; top: 20%; right: 15%; animation-delay: 1s; }
        .p3 { width: 100px; height: 100px; bottom: 15%; left: 20%; animation-delay: 2s; }
        .p4 { width: 50px; height: 50px; bottom: 25%; right: 25%; animation-delay: 3s; }
        .p5 { width: 70px; height: 70px; top: 50%; left: 5%; animation-delay: 4s; }
        @keyframes flutuar {
            0%,100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(180deg); }
        }
        .container-central { text-align: center; z-index: 10; padding: 2rem; }
        .titulo-jogo { font-size: 3.5rem; margin-bottom: 0.5rem; }
        .linha-1 { display: block; font-weight: 400; font-size: 2.5rem; }
        .linha-2 { display: block; font-weight: 800; font-size: 4rem; color: #FFD700; }
        .subtitulo-jogo { font-size: 1.2rem; margin-bottom: 3rem; opacity: 0.9; }
        .botoes-iniciais { display: flex; flex-direction: column; gap: 1.2rem; align-items: center; }
        button {
            padding: 1rem 2.5rem; font-size: 1.1rem; border: none; border-radius: 12px;
            cursor: pointer; transition: all 0.3s ease; font-weight: 600; width: 280px;
        }
        .btn-principal { background: #FFD700; color: #1B5E20; }
        .btn-principal:hover { transform: scale(1.05); box-shadow: 0 6px 20px rgba(255,215,0,0.4); }
        .btn-secundario { background: transparent; color: white; border: 2px solid white; }
        .btn-secundario:hover { background: rgba(255,255,255,0.2); }
        .btn-terciario { background: rgba(255,255,255,0.15); color: white; }
        .btn-terciario:hover { background: rgba(255,255,255,0.25); }
        .controle-audio { position: fixed; top: 20px; right: 20px; z-index: 100; }
        .controle-audio button { width: auto; padding: 0.6rem 1.2rem; font-size: 0.95rem; background: rgba(0,0,0,0.3); color: white; }
    </style>

    <script src="script-leitura.js"></script>
    <style>
        .btn-leitura {
            position: fixed;
            top: 15px;
            right: 15px;
            z-index: 9999;
            padding: 0.6rem 1rem;
            border: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: all 0.2s;
        }
        .btn-leitura:hover {
            transform: scale(1.03);
        }
    </style>

</head>

<body class="tela-inicial">

    <div class="fundo-animado">
        <div class="particula p1"></div>
        <div class="particula p2"></div>
        <div class="particula p3"></div>
        <div class="particula p4"></div>
        <div class="particula p5"></div>
    </div>

    <div class="controle-audio">
        <button id="btnMusica" onclick="alternarMusica()">🔊 Música: Ligado</button>
    </div>

    <div class="container-central">
        <div class="logo-container">
            <h1 class="titulo-jogo">
                <span class="linha-1">Mulheres que</span>
                <span class="linha-2">Inspiram</span>
            </h1>
            <p class="subtitulo-jogo">Ciência, Tecnologia, Cultura e AEE</p>
        </div>

        <div class="botoes-iniciais">
            <button onclick="iniciarJogo()" class="btn-principal grande">🎮 Iniciar Jogo</button>
            <button onclick="abrirSobre()" class="btn-secundario grande">📖 Sobre o Jogo</button>
            <button onclick="sairJogo()" class="btn-terciario grande">🚪 Sair do Jogo</button>
        </div>
    </div>

    <audio id="musicaInicial" loop>
        <source src="audio/tema-inicial.mp3" type="audio/mpeg">
    

    <script>
        let musicaLigada = true;
        const audio = document.getElementById('musicaInicial');
        if (audio) {
            audio.volume = 0.4;
            audio.play().catch(() => {});
        }

        function alternarMusica() {
            musicaLigada = !musicaLigada;
            if (musicaLigada) { audio.play(); document.getElementById('btnMusica').innerHTML = '🔊 Música: Ligado'; }
            else { audio.pause(); document.getElementById('btnMusica').innerHTML = '🔇 Música: Desligado'; }
        }

        function iniciarJogo() { window.location.href = 'introducao.html'; }
        function abrirSobre() { window.location.href = 'sobre.html'; }
        function sairJogo() { if(confirm('Tem certeza que deseja sair?')) window.close(); }
    </script>

</body>
</html>
